<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100e13">
    <title>Skills / Joah van der Sloot</title>
    <link rel="stylesheet" href="assets/css/portfolio.css">
    <script src="assets/js/portfolio-data.js" defer></script>
    <script src="assets/js/portfolio-en.js" defer></script>
    <script src="assets/js/portfolio-nl.js" defer></script>
    <script src="assets/js/portfolio.js" defer></script>
</head>
<body data-page="skills">
    <div id="app"></div>
    <button type="button" class="scroll-top" id="scroll-top" aria-label="Back to top" hidden>↑</button>
    <script>
        (function () {
            var btn = document.getElementById("scroll-top");
            var update = function () { btn.hidden = window.scrollY < 400; };
            window.addEventListener("scroll", update, { passive: true });
            btn.addEventListener("click", function () {
                var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
            });
            update();
        })();
    </script>
</body>
</html>
